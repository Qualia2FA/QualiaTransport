# cargo-deny configuration.
#
# This crate is a transport channel: it parses **attacker-controlled input**
# (scanned QR text, user-imported images), so dependency auditing is a security
# control here too, not a chore.
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Evaluates dependencies per target platform. This crate compiles for desktop
# and mobile, and mobile does not need image decoding (the platform camera
# returns text), so feature combinations are audited too.
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-linux-android" },
    { triple = "aarch64-apple-ios" },
]
# Dev-dependencies and optional features (`scan-image` pulls in `rqrr` → `lru` →
# `hashbrown`) are audited too: they do not reach the artifact, but they do
# enter CI and developer build environments.
all-features = true

[advisories]
version = 2
ignore = [
    # `paste` is archived (the author states it is no longer maintained).
    #
    # # How it gets in
    #
    # `paste` is reachable on **non-Windows** targets only: iroh → `netwatch`
    # (watches NIC changes) → `netdev` → `netlink-packet-*` (Linux netlink
    # bindings) → `paste`. `cargo tree --target x86_64-pc-windows-msvc -i paste`
    # prints "nothing to print", but the `[graph]` section lists Android/iOS, so
    # deny still evaluates it.
    #
    # # Why it is accepted for now
    #
    # 1. It is a **proc macro**, expanded at build time and absent at runtime:
    #    there is no remotely triggerable execution path.
    # 2. There is **no safe upgrade** (the advisory itself says `No safe upgrade
    #    is available!`). Removing it requires `netlink-packet-*` dropping
    #    `paste`, or dropping the `netwatch` dependency.
    # 3. `iroh-lan` is currently a **desktop** feature (mobile uses QR codes and
    #    already receives text), so real Android/iOS builds never enable it.
    #    `all-features = true` is the line that drags it into the audit's view.
    #
    # # When to review
    #
    # Re-evaluate before **mobile enables `iroh-lan`** as well: at that point it
    # is no longer a build-time tool but code that goes into the `.so`. Check
    # first whether `netlink-packet-*` has dropped `paste`.
    { id = "RUSTSEC-2024-0436", reason = "只经 Linux 的 netlink 绑定进入（桌面端 feature），过程宏、有界影响、无安全升级；移动端启用 iroh-lan 前必须复审（复审：2027-06-30）" },
]

[licenses]
version = 2
# This crate is released under LGPL-3.0-or-later and is an **independently
# reusable** library: any project that needs "let two ends exchange a small
# number of bytes through a QR code" can use it. The allow list therefore
# follows this crate's own dependency tree.
#
# Note: GPL-2.0-only / SSPL / BUSL and other licenses that are incompatible with
# LGPL-3.0 or non-free are **not** included.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # The license of `webpki-roots`. It is a **root certificate data package**
    # (not code), arriving with `iroh-relay` and `n0-dns-resolver`;
    # CDLA-Permissive-2.0 is a data license that allows any use and
    # redistribution. As long as the TLS side trusts public CAs, this entry
    # cannot be avoided.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    # `rqrr` is `(MIT OR Apache-2.0) AND ISC` -- both must be on the list.
    "ISC",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# Several entries in the allow list are currently matched by no dependency (they
# are kept for the iroh stack of the LAN channel), so "allowed license not
# encountered" is downgraded to allowed, to avoid drowning in noise before every
# dependency addition.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Explicitly banned crates and the reason for each.
deny = [
    # Upstream PQClean is archived; RUSTSEC-2026-0164 marks it unmaintained.
    { name = "pqcrypto" },
    { name = "pqcrypto-kyber" },
    { name = "pqcrypto-dilithium" },
    # The AVX2 backend skips Fujisaki–Okamoto implicit rejection, breaking the
    # CCA proof.
    { name = "pqc_kyber" },
    { name = "cosmian_kyber" },
    # The hybrid KEM is pre-verification and implements an old draft; 21
    # advisories in 10 months.
    { name = "libcrux-kem" },
    { name = "libcrux-aesgcm" },
    # CPace: no usable implementation in the Rust ecosystem.
    { name = "cpace" },
    { name = "pake-cpace" },
    # Merged into `aes`.
    { name = "aes-soft" },
    { name = "aesni" },
    # Image format decoders are a regular source of CVEs, and this crate
    # deliberately does not touch image formats: formats belong to the platform
    # (the JVM's ImageIO, Android's BitmapFactory, iOS's UIImage), and this
    # crate accepts pixels only. Keeping these out stops anyone from pulling the
    # whole decoding chain in for convenience.
    { name = "image" },
    { name = "zune-jpeg" },
    { name = "zune-png" },
    { name = "jpeg-decoder" },
    { name = "png" },
    { name = "gif" },
    { name = "webp" },
]

# Note: `rand` is not among the bans here. This crate itself uses **no
# randomness at all** (QR encoding is deterministic, and the randomness inside a
# payload is generated upstream through `getrandom`), but `proptest` pulls it in
# transitively, and using it in tests is appropriate. The actual discipline is
# stated in the README's interface contract: this crate generates no key
# material.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
