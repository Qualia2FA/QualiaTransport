# The cargo-fuzz target crate.
#
# Note: this crate is **not** a workspace member of `../Cargo.toml`; cargo-fuzz
# handles it separately, so `cargo test` / `cargo clippy` under the repository
# root never compile this directory.

[package]
name = "qualia-transport-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
# The fuzz targets feed arbitrary bytes to the library's public parsing entry
# points.
libfuzzer-sys = "0.4.13"
# Uses the default features: image decoding (the `qr_scan` target is exactly
# what covers it) must be compiled in.
qualia-transport = { path = ".." }

# Attacker-controlled input surface: scanned QR text. A QR code is public
# information displayed on a screen, so anyone who photographs or screenshots it
# can send **arbitrary** text down this path.
[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false
bench = false

# Attacker-controlled input surface: the image decoder. An image the user
# imports may have been supplied by someone else, which makes it untrusted
# input.
[[bin]]
name = "qr_scan"
path = "fuzz_targets/qr_scan.rs"
test = false
doc = false
bench = false

# Attacker-controlled input surface: the lobby's datagrams and connection
# information.
#
# **This surface is wider than the two above**: a QR code has to be photographed
# before data can get in, while a multicast group is a shared medium -- any
# machine on the same subnet can pour arbitrary bytes into `239.255.81.65:21377`
# with no precondition. The lobby's background thread feeds those bytes to the
# parser one by one.
[[bin]]
name = "lan_datagram"
path = "fuzz_targets/lan_datagram.rs"
test = false
doc = false
bench = false

# Attacker-controlled input surface: the dynamic QR code **reassembly state
# machine**.
#
# The two targets above are stateless (one line of text in, some bytes or an
# error out). The reassembler is different: it needs several frames in a row to
# reach states such as "the 1st frame of A was scanned, then the 2nd frame of
# B", which a single-input fuzz never reaches. This target therefore splits its
# input into segments and feeds them to the **same** reassembler one by one.
[[bin]]
name = "frame_reassemble"
path = "fuzz_targets/frame_reassemble.rs"
test = false
doc = false
bench = false
