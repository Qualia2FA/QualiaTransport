name: Publish

# Publishes on `v*` tags only.
#
# Deliberately **not** on pushes to master: publishing to crates.io is
# **irreversible**, and once a version number is taken it exists forever (yank
# only stops new dependency resolution; it does not remove what others already
# downloaded). Publishing must therefore be an explicit action, not a side
# effect of merging to the main branch.
#
# Note: this crate is currently `publish = false` (the public API is not stable
# yet). To publish, remove that line from `Cargo.toml` first -- `cargo publish
# --dry-run` explicitly refuses a `publish = false` package, so this step cannot
# be missed silently.
on:
  push:
    tags:
      - 'v*'
  # Allows one manual dry-run to inspect the packaged result without publishing.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Verify first: the version in the tag must match Cargo.toml, and packaging
  # must succeed on every target platform.
  #
  # Why **every** target platform: `cargo publish` only checks the build for the
  # current platform by default. A package that builds on Linux can fail to
  # package on Windows because of a wrong path in a `cfg` branch -- and by then
  # the version number is already spent.
  verify:
    name: Verify packaging
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 Cargo.toml 里的版本 $manifest 不一致"
            exit 1
          fi

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: verify
    # A manual trigger (workflow_dispatch) only runs verification, never
    # publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # `GITHUB_TOKEN` is read-only by default, and the last step creates a
    # Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        # The token comes from a repository secret and is injected only in the
        # publishing step -- the verification jobs do not need it, so it must
        # not appear in their environment.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PUBLISH_KEY }}
        run: cargo publish --locked

      - name: Tag the published commit
        # This step is reached only when `cargo publish` has **already
        # succeeded** (a failing previous step aborts the job).
        #
        # This step deliberately omits `set -e`: publishing is **irreversible**,
        # so "already on crates.io, but the GitHub Release was not created" must
        # never turn the whole job red -- that would read as a failed publishing
        # run.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release create "$GITHUB_REF_NAME" \
               --title "$GITHUB_REF_NAME" \
               --notes "Published to crates.io as \`qualia-transport\`." \
               --verify-tag; then
            echo "已创建 GitHub Release $GITHUB_REF_NAME"
          else
            echo "::warning::crate 已成功发布到 crates.io，但 GitHub Release 创建失败（通常是因为 workflow 缺少 contents: write 权限）。这不影响发布结果。"
          fi
