name: CI

# Note: the repository root is the crate root (crate `qualia-transport`), and
# every job runs from the repository root.
#
# This crate is a **transport channel**: it parses attacker-controlled input
# (scanned QR text, user-imported images, UDP datagrams sent by anyone on the
# same subnet), so CI focuses on:
#   1. the usual four checks (fmt / clippy / test / doc), all with `-D warnings`
#   2. **feature combinations** must be clean too -- image decoding off is the
#      mobile shape, and it must compile and pass the tests just the same
#   3. the optional LAN data plane (`iroh-lan`) as its own job: its dependency
#      tree is an order of magnitude larger than the crate itself, and mixing it
#      into the feature job would bury "is the crate itself clean?" under noise
#   4. the mobile target (Android) really compiles -- this crate will go into a
#      `.so`, and that path is never visible on Windows
#   5. MSRV and the dependency audit still hold (**without** `iroh-lan`, see the
#      comment on that job)
#   6. the fuzz targets always compile (otherwise they rot silently)

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  # ── Job 1: fmt, lint, tests (with image decoding) ───────────────────────────
  check-windows:
    name: fmt + clippy + test + doc（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Key: `--locked` guarantees that CI uses the versions committed to the
      # repository. A local dependency upgrade without a committed `Cargo.lock`
      # fails right here.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy（-D warnings）
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the closed loop "encode → render to pixels → read back from
      # pixels" and the property tests.
      - name: cargo test
        run: cargo test --locked --all-targets

      # Intra-doc links in the documentation are resolved by name; a broken link
      # is only a warning when `cargo doc` is run bare.
      - name: cargo doc（不得有警告）
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Job 2: feature combinations and the mobile target ───────────────────────
  check-features:
    name: 无默认 feature + Android 目标
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Android 目标
        run: rustup target add aarch64-linux-android

      # Turning image decoding off is the **mobile shape** (that side goes
      # through the platform camera and already holds text). No unused import or
      # wrong `cfg` may be left behind on this path.
      - name: cargo clippy --no-default-features（-D warnings）
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: cargo test --no-default-features
        run: cargo test --no-default-features --all-targets

      # Cross-compiles to Android: proves this crate also builds for a
      # non-Windows, non-x86 target.
      - name: cargo check（aarch64-linux-android）
        run: cargo check --target aarch64-linux-android --no-default-features --lib

  # ── Job 2b: LAN data plane (`iroh-lan`) ─────────────────────────────────────
  # Its own job, because it is an **optional feature** and its dependency tree
  # is an order of magnitude larger than the crate itself: mixing it into the
  # job above would bury "is the crate's own feature combination clean?" under
  # its noise.
  #
  # It runs on Windows rather than Ubuntu: the **real use case for this feature
  # is the desktop**, and the differences between the two sides (UDP binding,
  # NIC enumeration, netlink or not) all live in that dependency tree.
  check-iroh-lan:
    name: iroh-lan（局域网数据面）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo clippy --features iroh-lan（-D warnings）
        run: cargo clippy --all-targets --locked --features iroh-lan -- -D warnings

      # Includes the integration test in which two ends on the same machine
      # really run a QUIC handshake and exchange bytes.
      - name: cargo test --features iroh-lan
        run: cargo test --locked --features iroh-lan

      - name: cargo doc（不得有警告）
        run: cargo doc --no-deps --locked --features iroh-lan
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Job 3: MSRV ─────────────────────────────────────────────────────────────
  # The `rust-version` declared in Cargo.toml must really compile, otherwise the
  # declaration is a lie.
  #
  # **Deliberately without `iroh-lan`**: iroh 1.3.0 declares `rust-version`
  # 1.91, while this crate's floor is 1.89. Writing `--all-features` here would
  # make this job require iroh's MSRV instead, a number this repository does not
  # decide. This relation between features and the MSRV is documented in the
  # README's MSRV policy.
  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 1.89 工具链
        run: rustup toolchain install 1.89 --profile minimal

      - name: cargo +1.89 check（两种 feature 组合）
        run: |
          cargo +1.89 check --all-targets
          cargo +1.89 check --all-targets --no-default-features

  # ── Job 4: dependency audit ─────────────────────────────────────────────────
  deny:
    name: cargo-deny（依赖审计 + 许可证）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # ── Job 5: fuzz smoke test ──────────────────────────────────────────────────
  # Only a bounded number of rounds: CI cannot run long fuzzing, but a short run
  # catches obvious panics and keeps the fuzz targets compiling.
  fuzz-smoke:
    name: fuzz 冒烟（限时）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 nightly（cargo-fuzz 需要 -Zsanitizer）
        run: rustup toolchain install nightly --component rust-src

      - name: 安装 cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: 对每个 fuzz 目标跑 60 秒
        working-directory: fuzz
        shell: bash
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list); do
            echo "::group::fuzz $target"
            # Seed the corpus with the committed regression inputs first: the
            # generated corpus/ is not committed, so it starts empty every run,
            # and regressions/ is the only persistent guarantee.
            if [ -d "regressions/$target" ]; then
              mkdir -p "corpus/$target"
              cp -n "regressions/$target"/* "corpus/$target"/ 2>/dev/null || true
            fi
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
