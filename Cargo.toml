[package]
name = "qualia-transport"
version = "0.1.0"
edition = "2024"
# MSRV 与其余仓库一致。本 crate 自己的代码 1.85 就能编译，最紧的一环是
# `rqrr`（1.85.1）；把下限钉在 1.89 是为了让整个项目的工具链只有一个数字。
rust-version = "1.89"
license = "LGPL-3.0-or-later"
description = "Transport channels for Qualia2FA: QR code carriage and LAN discovery."
repository = "https://github.com/Qualia2FA/QualiaTransport"
readme = "README.md"
keywords = ["qrcode", "qr", "transport", "offline", "2fa"]
categories = ["encoding"]
# 发布包里不放 CI 配置、依赖审计清单与 fuzz 目标：它们对使用者没有意义，
# 而 crates.io 的包体大小与内容都是公开可见的。
exclude = ["/.github", "/deny.toml", "/fuzz"]
# 暂时不发布：对外 API 还没稳定到值得占用一个永久版本号（crates.io 上的版本号
# 一旦占位就永久存在）。依赖它的上层目前也不在别的仓库里。
publish = false

[dependencies]
# ── 二维码编码 ────────────────────────────────────────────────────────────
# Nayuki 的参考实现（同一份源码被移植到十余种语言，上游自带测试向量）。选它的
# 理由有三条，每条都是这个位置特有的：
#
# 1. **它是单文件、零依赖、零 unsafe**（1242 行，含注释）。二维码编码是可以被读
#    完的算法，能读完就不必信任。
# 2. **API 正好给出本项目最需要的那个参数对**：`encode_segments_advanced` 收
#    「最小版本 / 最大版本」，装不下时返回 `DataTooLong`。平台的「最大版本」是能力
#    声明（见 `src/qr/mod.rs`），编码必须在那一版之内完成，否则就是「装不下」。
# 3. **它自己就是规范的表**：容量、纠错块划分、掩码罚分都在源码里以公式给出，
#    而不是一张手抄的表——本项目已经吃过一次「手抄常量抄错却不报错」的亏。
#
# 许可证 MIT，与 LGPL-3.0-or-later 兼容。
qrcodegen = "1.8.0"

# ── 二维码解码（从图像里读） ──────────────────────────────────────────────
# 桌面端没有摄像头，「选一张图片导入」是它唯一的扫码路径；移动端走平台相机、
# 拿到的已经是文本，不需要图像解码。因此它是可选依赖，默认开启、可以关掉。
#
# 关掉默认 feature 是为了甩开它的 `image` 依赖：我们喂给它的是**灰度像素**，
# 图像格式的解码归平台（见 `src/image.rs` 的说明）。
#
# 诚实记一笔：它是本 crate 依赖树里**唯一**带 unsafe 的地方——它自己一行 unsafe
# 都没有（4749 行，`unsafe` 零命中），但它的直接依赖 `lru`（缓存实现）里有。
# 这就是为什么图像解码被做成一个可以整体关掉的 feature：移动端构建不需要它。
#
# `rqrr` 自身维护活跃（2026-09 仍有发布），许可 `(MIT OR Apache-2.0) AND ISC`。
rqrr = { version = "0.11.0", default-features = false, optional = true }

# 错误类型。与其他仓库同一个 major，避免出现两份 thiserror。
thiserror = "2.0.21"

# ── 设备标识 ──────────────────────────────────────────────────────────────
# `DeviceId`（设备身份公钥的 SHA-256）用在两个地方：大厅公告里「这台设备是谁」，
# 以及传输层对端的索引。它是**独立子库**，本 crate 因此不需要（也不该）自己再定义
# 一遍——同一个概念在两个仓库里长出两种表示，会让「这两个值是不是同一台设备」变成
# 一个需要转换的问题，而转换点正是出错的地方。
#
# 它只带来公钥侧（表示 / 指纹 / 验签）；私钥侧住在平台硬件密钥库里，本 crate 不碰。
#
# 这里用**版本号**而不是路径：路径依赖会让同一个物理目录在不同仓库里被不同的相对
# 路径引用，而 GitHub Actions 拒绝把仓库检出到工作区之外。本地要改它的代码时用
# `[patch.crates-io]` 临时指到同级目录。
qualia-dik = "0.1"

# ── 局域网 socket（只有大厅需要） ─────────────────────────────────────────
# `std::net::UdpSocket` 已经能做组播（`join_multicast_v4` / `set_multicast_ttl_v4`
# / `set_multicast_loop_v4`），因此这个依赖**不是**为了组播——它是为了
# **`SO_REUSEADDR`**，而那正是让「同一台机器上两个进程都能加入同一个组播组」成立的
# 东西：缺了它，第二个进程要么 `bind` 直接失败（Windows），要么收不到任何东西
# （Linux）。
#
# 本 crate 用它而不是自己写 `setsockopt`：本 crate 有 `#![forbid(unsafe_code)]`，
# 而 `setsockopt` 是 `unsafe`。把唯一需要 `unsafe` 的那一步交给一个专门做这件事、
# 且被广泛使用的 crate，比自己开一个 `unsafe` 的口子更可控。
#
# 它同时让「先建 socket、再设选项、最后 bind」这个正确顺序成为可能——`std` 的
# `UdpSocket::bind` 是一步到位的，中间没有插选项的机会。
#
# `socket2` 来自 `rust-lang/socket2`，无其它传递依赖，许可 MIT OR Apache-2.0。
socket2 = { version = "0.6", default-features = false, features = ["all"] }

# ── 局域网数据面（可选，feature `iroh-lan`） ──────────────────────────────
# iroh 是 QUIC + 公钥即身份的点对点传输层。用它而不是自己写 QUIC，理由见
# `src/lan/transport.rs` 的模块文档：TLS 握手、丢包恢复、以及「不信任网络的前提下
# 确认对方身份」这三件事都不该由本项目重新实现一遍。
#
# **关掉 default features**：默认集里的 `portmapper` 会去路由器上开端口映射（那既是
# 一次额外的网络动作，也要求路由器支持 UPnP/NAT-PMP），而本项目的局域网通道只要求
# 同一个广播域内可达。`metrics` 也不需要。TLS 后端显式选 `tls-aws-lc-rs`（见下方
# `[features]` 的说明）。
iroh = { version = "1.3.0", default-features = false, optional = true }

# iroh 是 async 的，而本 crate 面对的是同步调用方（界面线程、核心库的同步
# `Transport`）。桥接方式是起一个运行时并用 `block_on`，因此这里只要运行时与
# 时间、channel 这几块，不要 `full`。
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "time",
    "sync",
], optional = true }

[features]
default = ["scan-image"]
# 从**图像**里读二维码（图片导入扫描）。
scan-image = ["dep:rqrr"]
# 局域网的数据面（iroh 的离线配置，D7）。
#
# # 为什么 TLS 后端选 `ring` 而不是 D8 说的 `aws-lc-rs`
#
# D8 的结论适用于**会出网**的传输层：那里要 `X25519MLKEM768` 混合 KEM 来防「现在
# 录下来、将来解密」。本 feature 是局域网通道——两端在同一个广播域里、流量根本不出
# 网，因此后量子那一层的收益为零，而代价是 `aws-lc-rs` 需要 cmake 与 NASM 才能构建
# （本 crate 要交叉编译到 Android）。
#
# **这个取舍有边界，不要外推**：将来接上真正过网的传输（iroh 的 relay、或者别的
# 出网通道）时，必须回到 D8 的 `aws-lc-rs` 方案，而不是沿用这里的 `ring`。
iroh-lan = ["dep:iroh", "dep:tokio", "iroh/tls-ring"]

[dev-dependencies]
# 属性测试：线格式的往返、以及「任意输入都不得 panic」。
proptest = "1.12.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
