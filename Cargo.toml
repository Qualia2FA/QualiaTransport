[package]
name = "qualia-transport"
version = "0.1.3"
edition = "2024"
# MSRV, the same as the rest of the repositories. This crate's own code compiles
# on 1.85, and the tightest link is `rqrr` (1.85.1); the floor is pinned at 1.89
# so that the whole project names a single toolchain number.
rust-version = "1.89"
license = "LGPL-3.0-or-later"
description = "Transport channels for Qualia2FA: QR code carriage and LAN discovery."
repository = "https://github.com/Qualia2FA/QualiaTransport"
readme = "README.md"
keywords = ["qrcode", "qr", "transport", "offline", "2fa"]
categories = ["encoding"]
# CI configuration, the dependency audit manifest and the fuzz targets are not
# part of the published package: they are meaningless to users, and the size and
# contents of a crates.io package are publicly visible.
exclude = ["/.github", "/deny.toml", "/fuzz"]

[dependencies]
# ── QR encoding ───────────────────────────────────────────────────────────────
# Nayuki's reference implementation (the same source is ported to a dozen
# languages, and upstream ships its own test vectors). It is a single file with
# no dependencies and no `unsafe` (1242 lines including comments).
#
# `encode_segments_advanced` takes a "minimum version / maximum version" pair
# and returns `DataTooLong` when the payload does not fit. A platform's maximum
# version is a capability declaration (see `src/qr/mod.rs`): encoding must
# finish inside that version, otherwise the payload does not fit.
#
# Capacity, error-correction block layout and mask penalty are given in the
# source as formulas rather than as a hand-transcribed table.
#
# License MIT, compatible with LGPL-3.0-or-later.
qrcodegen = "1.8.0"

# ── QR decoding (reading from an image) ───────────────────────────────────────
# Desktop has no camera, so "import an image" is its only scanning path; mobile
# goes through the platform camera and already holds text, so it needs no image
# decoding. This is therefore an optional dependency, enabled by default and
# possible to turn off.
#
# Default features are turned off to shed its `image` dependency: what this
# crate feeds it is **grayscale pixels**, and image format decoding belongs to
# the platform (see `src/image.rs`).
#
# This is the **only** part of this crate's dependency tree that involves
# `unsafe`: `rqrr` itself has none (4749 lines, zero `unsafe` hits), but its
# direct dependency `lru` (a cache) does. That is why image decoding is a
# feature that can be turned off as a whole: mobile builds do not need it.
#
# `rqrr` is actively maintained (a release as of 2026-09), license `(MIT OR
# Apache-2.0) AND ISC`.
rqrr = { version = "0.11.0", default-features = false, optional = true }

# Error types. Same major as the other repositories, to avoid two copies of
# thiserror.
thiserror = "2.0.21"

# ── Device identity ───────────────────────────────────────────────────────────
# `DeviceId` (the SHA-256 of the device identity public key) is used in two
# places: "which device is this" in lobby announcements, and the peer index of
# the transport layer. It is an **independent sub-library**, so this crate does
# not (and must not) define it a second time.
#
# It brings the public half only (representation / fingerprint / verification);
# the private half lives in the platform hardware keystore, which this crate
# never touches.
#
# A **version number** is used here rather than a path: a path dependency would
# reference the same physical directory through different relative paths in
# different repositories, and GitHub Actions refuses to check out a repository
# outside the workspace. To work on its code locally, point `[patch.crates-io]`
# at the sibling directory.
qualia-dik = "0.1"

# ── LAN sockets (needed by the lobby only) ────────────────────────────────────
# `std::net::UdpSocket` already does multicast (`join_multicast_v4` /
# `set_multicast_ttl_v4` / `set_multicast_loop_v4`), so this dependency is
# **not** for multicast -- it is for **`SO_REUSEADDR`**, which is what lets two
# processes on the same machine join the same multicast group: without it the
# second process either fails `bind` outright (Windows) or receives nothing at
# all (Linux).
#
# This crate uses it instead of writing `setsockopt` itself: the crate has
# `#![forbid(unsafe_code)]`, and `setsockopt` is `unsafe`.
#
# It also makes the correct order -- create the socket, set the options, bind --
# possible: `std`'s `UdpSocket::bind` does all three in one step, with no room
# for options in between.
#
# `socket2` comes from `rust-lang/socket2`, has no other transitive
# dependencies, and is licensed MIT OR Apache-2.0.
socket2 = { version = "0.6", default-features = false, features = ["all"] }

# ── LAN data plane (optional, feature `iroh-lan`) ─────────────────────────────
# iroh is a QUIC point-to-point transport layer in which the public key is the
# identity. See the module documentation in `src/lan/transport.rs`: TLS
# handshake, loss recovery, and "confirm the peer's identity without trusting
# the network" are three things this project should not reimplement.
#
# **Default features are off**: the default set's `portmapper` opens port
# mappings on the router (an extra network action that also requires
# UPnP/NAT-PMP support), while this project's LAN channel only requires
# reachability within one broadcast domain. `metrics` is not needed either. The
# TLS backend is selected explicitly by the `iroh-lan` feature as
# `iroh/tls-ring` (see `[features]` below).
iroh = { version = "1.3.0", default-features = false, optional = true }

# iroh is async, while this crate faces synchronous callers (the UI thread, the
# core library's synchronous `Transport`). The bridge starts a runtime and uses
# `block_on`, so only the runtime, time and channel pieces are needed here, not
# `full`.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "time",
    "sync",
], optional = true }

[features]
default = ["scan-image"]
# Reads QR codes from **images** (image import scanning).
scan-image = ["dep:rqrr"]
# The LAN data plane (iroh's offline configuration).
#
# The TLS backend is `ring` rather than `aws-lc-rs`: `aws-lc-rs` is for
# transport layers that leave the network, where the `X25519MLKEM768` hybrid KEM
# guards against "record now, decrypt later". This feature is a LAN channel --
# both ends sit in the same broadcast domain and traffic never leaves it -- so
# the post-quantum layer buys nothing here, while `aws-lc-rs` needs cmake and
# NASM to build (this crate cross-compiles to Android).
#
# **This trade-off has a boundary and must not be extrapolated**: a transport
# that really goes over the network (iroh's relay, or another outbound channel)
# needs `aws-lc-rs`.
iroh-lan = ["dep:iroh", "dep:tokio", "iroh/tls-ring"]

[dev-dependencies]
# Property tests: wire-format round trips, and "no input may cause a panic".
proptest = "1.12.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
